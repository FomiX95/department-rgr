services:
  db:
    image: postgres:latest
    container_name: department-db
    environment:
      POSTGRES_DB: department
      POSTGRES_USER: ${DB_LOGIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: